name: Generate Coverage Badge (Manual)

on:
  workflow_dispatch:   

jobs:
  coverage:
    name: Generate Coverage and Update Badge
    runs-on: windows-latest

    steps:
      # 🧱 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # ⚙️ 2. Install .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x   

      # 📦 3. Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # 🧪 4. Tests & Coverage 
      - name: Run tests and collect coverage
        run: dotnet test SnakeCoreTests/SnakeCoreTests.csproj --collect:"XPlat Code Coverage" --results-directory ./SnakeCoreTests/TestResults

      # 🏷️ 5. Generate coverage badge and push
      - name: Generate & update coverage badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: Scripts\coverage_badge.bat
